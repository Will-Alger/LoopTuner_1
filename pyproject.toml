[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "looptuner"
version = "0.1.0"
description = "Bayesian tuning suggestions for iOS closed-loop T1D settings from Nightscout data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "requests>=2.31",
    "pymc>=5.10",
    "arviz>=0.17",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
looptuner = "looptuner.cli:main"

[tool.setuptools.packages.find]
include = ["looptuner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
